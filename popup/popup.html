<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Liquid Glass</h1>
  <label class="row"><span>Enabled</span><input type="checkbox" id="enabled"></label>
  <label class="col"><span>Blur <b id="v-blur"></b></span><input type="range" id="blur" min="0" max="60"></label>
  <label class="col"><span>Saturation <b id="v-saturation"></b></span><input type="range" id="saturation" min="100" max="300"></label>
  <label class="col"><span>Glass tint <b id="v-tint"></b></span><input type="range" id="tint" min="0" max="40"></label>
  <label class="col"><span>Corner radius <b id="v-radius"></b></span><input type="range" id="radius" min="0" max="40"></label>
  <label class="row"><span>Cursor specular highlight</span><input type="checkbox" id="specular"></label>
  <label class="row"><span>Ambient colour wash</span><input type="checkbox" id="ambient"></label>
  <label class="col"><span>Extra selectors (one per line)</span>
    <textarea id="extra" rows="3" placeholder=".some-class"></textarea>
  </label>
  <button id="reset">Reset to defaults</button>
  <script src="popup.js"></script>
</body>
</html>
